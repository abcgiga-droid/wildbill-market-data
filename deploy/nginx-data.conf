# Include inside the chart site's server{} block after the VM data root exists.
# This replaces the old /data/ proxy with direct, cacheable static delivery.
location /data/ {
    alias /srv/wildbill-data/current/data/;
    try_files $uri =404;
    gzip on;
    gzip_types application/json;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

# The live API may remain proxied to the chart server.
location /api/ {
    proxy_pass http://127.0.0.1:8910/api/;
    proxy_http_version 1.1;
    proxy_read_timeout 20s;
    proxy_connect_timeout 5s;
    add_header Cache-Control "no-store";
}
